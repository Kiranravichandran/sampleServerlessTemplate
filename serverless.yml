service: sampleserverlesstemplate #Replace it using your application name

provider:
  name: aws
  runtime: nodejs14.x
  lambdaHashingVersion: 20201221
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 512
  timeout: 30
  stackTags:
    appname: ${self:service.name}
    createdby: serverless #replace it by your email id
    owner: appdev
    approle: creating serverless framework
    environment: ${self:provider.stage}
  ecr:
    images:
      appimage:
        path: ./

# lambda functions
functions:
  # hello world api with path parameters
  helloWorld:
    image:
      name: appimage
    events:
      - http:
         # http request path with path parameter
         path: /hello/{message}
         method: GET
         request:
           parameters:
             paths:
               message: true

# Remove webpack plugin since we're using Docker
plugins:
  - serverless-offline
